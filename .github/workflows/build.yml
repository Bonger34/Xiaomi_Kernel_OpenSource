name: Build Kernel (KernelSU)
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: base defconfig
        required: true
        default: vendor/umi_user_defconfig
      clang_repo:
        description: clang prebuilt repo
        required: false
        default: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # gcc-aarch64-linux-gnu 是必须的：clang 要用它的 as/elfedit 作外部汇编器
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 rsync zip unzip cpio lz4 xz-utils git curl build-essential \
            gcc-aarch64-linux-gnu

      - name: Fetch clang toolchain
        run: |
          git clone --depth 1 "https://github.com/${{ inputs.clang_repo }}" "$HOME/tc"
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"
          "$HOME/tc/bin/clang" --version

      # ── 修复 ①：dtc 的 yylloc 重复定义 ────────────────────────────────
      # GCC 10+ 默认 -fno-common，dtc-lexer.l 的 "YYLTYPE yylloc;" 与
      # dtc-parser.tab.o 里的定义冲突 → ld 报 multiple definition。
      - name: Fix dtc yylloc for -fno-common
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l
          grep -n "YYLTYPE yylloc" scripts/dtc/dtc-lexer.l

      # ── 修复 ②：CROSS_COMPILE + GCC_TOOLCHAIN_DIR ─────────────────────
      # (a) 必须显式给 CROSS_COMPILE：4.19.81 的 Makefile:489-491 里
      #     --target= 只在 CROSS_COMPILE 非空时才加，否则 clang 按宿主
      #     x86_64 编译，报：
      #       stack_pointer.h:8: error: register 'sp' unsuitable ...
      #       kgdb.h:32: error: value '1025' out of range for constraint 'I'
      #
      # (b) 必须覆盖 GCC_TOOLCHAIN_DIR：Makefile:495 算的是
      #       $(dir $(which $(CROSS_COMPILE)elfedit))  →  /usr/bin/
      #     于是 --prefix=/usr/bin/，clang 去找 /usr/bin/as。
      #     本地（aarch64 主机）那是 aarch64 汇编器所以能过，
      #     但 x86 runner 上是 x86 汇编器，不认 -EL：
      #       /usr/bin/as: unrecognized option '-EL'
      #     覆盖成 /usr/bin/aarch64-linux-gnu- 后，clang 正确找到
      #     /usr/bin/aarch64-linux-gnu-as（实测接受 -EL）。
      - name: Configure
        run: |
          set -e
          # 该 Makefile 把 CC 设为 scripts/gcc-wrapper.py（python2 语法），
          # 所以命令行覆盖 CC 以绕过 wrapper。
          make O=out ARCH=arm64 \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- GCC_TOOLCHAIN=/usr \
            ${{ inputs.defconfig }}
          make O=out ARCH=arm64 \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- GCC_TOOLCHAIN=/usr \
            olddefconfig
          echo "==== key config ===="
          grep -E "^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|HAVE_KPROBES)=" out/.config || true

      - name: Build
        run: |
          make O=out ARCH=arm64 \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- GCC_TOOLCHAIN=/usr \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/.config
          if-no-files-found: error
