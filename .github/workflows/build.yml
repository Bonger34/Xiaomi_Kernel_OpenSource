name: Build Kernel (KernelSU) - Android 11
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: base defconfig
        required: true
        default: vendor/umi_user_defconfig
      localversion:
        description: >-
            vermagic 版本后缀。Android 11：V12.5.11.0=-perf-g0b95fdde9a8c ｜
            V12.1.3.0=-perf-g8a493da
        required: true
        default: "-perf-g0b95fdde9a8c"
      # 以下三项让 uname -v 与原厂一字不差（mkcompile_h 原样拼接，不经 date 解析）。
      # 每个固件版本的原厂值都不同，需逐版本填：
      #   V12.5.11.0: Sat Dec 4 16:14:01 CST 2021 / builder@m1-xm-ota-bd125.bj.idc.xiaomi.com
      #   V12.1.3.0 : Sat Sep 5 00:36:18 CST 2020 / builder@c4-miui-ota-bd64.bj
      build_timestamp:
        description: KBUILD_BUILD_TIMESTAMP（原样拼入 UTS_VERSION）
        required: true
        default: "Sat Dec 4 16:14:01 CST 2021"
      build_user:
        description: KBUILD_BUILD_USER
        required: true
        default: builder
      build_host:
        description: KBUILD_BUILD_HOST
        required: true
        default: m1-xm-ota-bd125.bj.idc.xiaomi.com
      clang_repo:
        description: clang prebuilt repo
        required: false
        default: LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # 空值可抑制 setlocalversion 追加的 "+" 后缀
      LOCALVERSION: ""
      # 让 UTS_VERSION / builder 与原厂一致
      KBUILD_BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
      KBUILD_BUILD_USER: ${{ inputs.build_user }}
      KBUILD_BUILD_HOST: ${{ inputs.build_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 rsync zip unzip cpio lz4 xz-utils git curl build-essential \
            gcc-aarch64-linux-gnu

      - name: Fetch clang toolchain
        run: |
          git clone --depth 1 "https://github.com/${{ inputs.clang_repo }}" "$HOME/tc"
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"
          "$HOME/tc/bin/clang" --version

      # 修复 ①：dtc 的 yylloc 重复定义（GCC 10+ 默认 -fno-common）
      - name: Fix dtc yylloc for -fno-common
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l
          grep -n "YYLTYPE yylloc" scripts/dtc/dtc-lexer.l

      # 修复 ②b：可复现构建——gen_kheaders.sh 的 tar 会记录源文件 mtime
      #          （= CI checkout 时间），使 kheaders_data.tar.xz 压缩后长度每次
      #          不同（实测差 1128 字节），把其后约 10MB 内容整体顶偏。
      #          注：SOURCE_DATE_EPOCH 对 GNU tar 无效，必须用 --mtime。
      - name: Fix kheaders tar mtime (reproducible build)
        run: |
          sed -i 's|^tar -Jcf \$tarfile|tar --mtime=@0 --owner=0 --group=0 --numeric-owner -Jcf $tarfile|' \
            kernel/gen_kheaders.sh
          grep -n "Jcf" kernel/gen_kheaders.sh

      # 修复 ②c：可复现构建——ld.lld 的 --build-id 默认样式含随机成分
      #          （实测：kheaders 修好后其余字节全同，唯独 build-id 每次不同），
      #          改为 --build-id=none 以彻底确定化。
      - name: Disable nondeterministic build-id
        run: |
          sed -i 's|^LDFLAGS_BUILD_ID := .*|LDFLAGS_BUILD_ID := --build-id=none|' Makefile
          grep -n "LDFLAGS_BUILD_ID" Makefile

      # 修复 ②：CROSS_COMPILE + GCC_TOOLCHAIN_DIR（否则 clang 按宿主 x86_64 编译，
      #          且 --prefix 会指向 x86 汇编器）
      # 修复 ③：vermagic 必须与原厂一致：
      #          4.19.113-perf-<hash> SMP preempt mod_unload modversions aarch64
      #          → LOCALVERSION_AUTO=n、LOCALVERSION 空值、MODVERSIONS=y
      #          （MODVERSIONS 必须在，否则 vermagic 少 "modversions"，
      #           模块带 __versions 时 same_magic 会逐字比较而拒绝加载）
      - name: Configure
        run: |
          set -e
          COMMON="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- GCC_TOOLCHAIN=/usr"
          make O=out $COMMON ${{ inputs.defconfig }}
          make O=out $COMMON olddefconfig
          scripts/config --file out/.config \
            --set-str LOCALVERSION "${{ inputs.localversion }}" \
            --disable LOCALVERSION_AUTO \
            --enable MODVERSIONS
          make O=out $COMMON olddefconfig
          echo "==== key config ===="
          grep -E "^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|HAVE_KPROBES|MODVERSIONS|LOCALVERSION)=" out/.config || true
          echo "==== UTS_RELEASE (vermagic 前缀) ===="
          make O=out $COMMON include/config/kernel.release
          cat out/include/config/kernel.release

      # 用 ld.lld：GNU ld 在链接该内核时另报
      #   relocation truncated to fit: R_AARCH64_ADR_PREL_PG_HI21 ...
      - name: Build
        run: |
          make O=out ARCH=arm64 \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            GCC_TOOLCHAIN_DIR=/usr/bin/aarch64-linux-gnu- GCC_TOOLCHAIN=/usr \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image
          echo "==== 产物内嵌 vermagic ===="
          grep -aoE '4\.19\.[0-9]+[^\x00]{0,25} SMP preempt[^\x00]{0,40}' \
            out/arch/arm64/boot/Image | head -3 || true
          echo "==== 完整版本串（应与原厂一致）===="
          grep -aoE 'Linux version 4\.19\.[0-9]+[^\x00]{0,140}' \
            out/arch/arm64/boot/Image | head -1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/.config
          # upload-artifact v4 默认排除隐藏文件，需显式开启才能带上 .config
          include-hidden-files: true
          if-no-files-found: error
